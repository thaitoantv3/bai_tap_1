<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="profile_setting">
    <aside class="aside">
        <div class="menu">
            <img src="element-4.svg" alt="Dashboard">
        </div>
        <div class="menu">
            <img src="graph.svg" alt="Analytics">
        </div>
        <div class="menu">
            <img src="medal-star.svg" alt="Profile">
        </div>
        <div class="menu">
            <img src="messages.svg" alt="Messages">
        </div>
        <div class="menu">
            <img src="setting-2.svg" alt="Settings">
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div class="head1">
                <span class="welcome">Welcome, Amanda</span><br>
                <span class="date">Tue, 07 June 2022</span>
            </div>

            <div class="head_right">
                <div class="icon_seach">
                    <img src="search-normal.svg" alt="Search">
                    <input type="text" placeholder="Search">
                </div>
                
                <div class="bell-icon">
                    <img src="notification-bing.svg" alt="Notification">
                </div>
                
                <img src="Rectangle 1072.svg" alt="Avatar" class="avatar-box">
            </div>
        </header>

        <div class="banner"></div>

        <div class="profile-info-section">
            <div class="user-meta">
                <img src="Ellipse 11.svg" alt="Profile Picture" class="large-avatar">
                <div class="user-text">
                    <h2>Alexa Rawles</h2>
                    <p>alexarawles@gmail.com</p>
                </div>
            </div>
            <button type="button" class="btn-edit">Edit</button>
        </div>

        <form class="profile-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Your First Name">
                </div>
                <div class="form-group">
                    <label>Nick name</label>
                    <input type="text" placeholder="Your Nick Name">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div class="select-wrapper">
                        <select><option>Your Gender</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <div class="select-wrapper">
                        <select><option>Your Country</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Language</label>
                    <div class="select-wrapper">
                        <select><option>Your Language</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Time Zone</label>
                    <div class="select-wrapper">
                        <select><option>Your Time Zone</option></select>
                    </div>
                </div>
            </div>

            <div class="email-section">
                <h3>My email Address</h3>
                <div class="email-item">
                    <div class="email-icon">✉</div>
                    <div class="email-info">
                        <span class="email-name">alexarawles@gmail.com</span>
                        <span class="email-time">1 month ago</span>
                    </div>
                </div>
                <button type="button" class="btn-add-email">+Add Email Address</button>
            </div>
        </form>
    </main>
</div>

</body>
</html>
